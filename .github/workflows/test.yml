name: Test PDF positioning

on:
  push:
    branches: ['**']
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Upload visual test diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-positioning-diffs
          path: test-results/pdf-positioning
          if-no-files-found: ignore
